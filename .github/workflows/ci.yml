name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, unit tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  browser:
    name: Oscar extension browser suites
    runs-on: ubuntu-24.04
    # On GitHub's runners Chrome stops reporting new tabs and windows to
    # Playwright once a test closes one, so most suites time out there. They
    # pass in full locally, which is the release gate (npm run test:oscar).
    # This job runs for the record and does not block merging.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:oscar
        env:
          EDT_TEST_DEBUG: "1"
